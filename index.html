<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sahel Game - prototype</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #87a7c9; font-family: system-ui, sans-serif; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #cross { position: fixed; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; pointer-events: none; }
  #cross:before, #cross:after { content: ""; position: absolute; background: #fff; opacity: .9; box-shadow: 0 0 2px #000; }
  #cross:before { left: 10px; top: 0; width: 2px; height: 22px; }
  #cross:after { top: 10px; left: 0; height: 2px; width: 22px; }
  #hud { position: fixed; left: 12px; bottom: 12px; color: #fff; text-shadow: 0 0 3px #000; font-size: 14px; line-height: 1.4; pointer-events: none; white-space: pre; display: none; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; text-shadow: 0 0 4px #000;
         font-size: 20px; text-align: center; background: rgba(0,0,0,.35); pointer-events: none; }
  .tbtn { position: fixed; z-index: 6; width: 64px; height: 64px; border-radius: 50%; background: rgba(20,16,10,.55); border: 2px solid rgba(255,255,255,.85); font-weight: 700; text-shadow: 0 0 3px #000; touch-action: none;
          color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; user-select: none; }
  #stick { position: fixed; left: 24px; bottom: 24px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.18); border: 2px solid rgba(255,255,255,.5); }
  /* menu des tenues à gauche : le personnage reste visible à droite pour voir la tenue qu'on choisit */
  #wardrobe { position: fixed; top: 0; bottom: 0; left: 0; width: min(430px, 100%); align-items: center; justify-content: flex-start; padding: 0 0 0 clamp(12px, 4vw, 60px); box-sizing: border-box;
              background: linear-gradient(90deg, rgba(8,6,4,.82) 0%, rgba(8,6,4,.62) 70%, rgba(8,6,4,0) 100%); color: #fff; z-index: 5; }
  #hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 3;
          background: radial-gradient(ellipse at center, rgba(180,0,0,0) 45%, rgba(190,20,10,.55) 100%); }
  #hurt.on { opacity: 1; transition: none; }
  #danger { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 3; background: radial-gradient(ellipse at center, rgba(160,0,0,0) 55%, rgba(170,10,10,.5) 100%); }
  #danger.on { animation: dangerPulse 1.1s ease-in-out infinite; }
  @keyframes dangerPulse { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }
  #hitmark { position: fixed; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 3; }
  #hitmark.on { opacity: 1; transition: none; }
  #hitmark i { position: absolute; width: 12px; height: 2px; background: #fff; box-shadow: 0 0 2px #000; }
  #hitmark.kill i { background: #ff4a3a; }
  #hitmark i:nth-child(1) { left: 0; top: 4px; transform: rotate(45deg); } #hitmark i:nth-child(2) { right: 0; top: 4px; transform: rotate(-45deg); }
  #hitmark i:nth-child(3) { left: 0; bottom: 4px; transform: rotate(-45deg); } #hitmark i:nth-child(4) { right: 0; bottom: 4px; transform: rotate(45deg); }
  /* barre de vie : en haut au centre, style « vitesse » : segments inclinés, dégradé jaune -> vert (rouge quand on est presque mort) */
  #life { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; pointer-events: none; color: #fff; text-shadow: 0 0 3px #000; z-index: 2; font-style: italic; }
  #lifelab { font-size: 14px; letter-spacing: .04em; opacity: .9; }
  #lifebar { position: relative; width: 300px; height: 16px; transform: skewX(-22deg); background: rgba(20,20,20,.8); border-radius: 2px; overflow: hidden; box-shadow: 0 0 6px rgba(0,0,0,.6); }
  #lifebar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 12px, rgba(20,20,20,.95) 12px 15px); }
  #lifefill { position: absolute; left: 0; top: 0; height: 100%; width: 100%; background: linear-gradient(90deg, #ffd23a, #3ddc5a); transition: width .2s; }
  #lifetxt { font-weight: 700; min-width: 34px; font-size: 18px; font-style: normal; }
  #radar { position: fixed; left: 12px; top: 40px; width: 160px; height: 160px; z-index: 2; pointer-events: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.45)); }
  #ammo { position: fixed; right: 16px; bottom: 16px; padding: 8px 14px; border-radius: 8px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.35); color: #fff; font-size: 12px; letter-spacing: 2px;
          text-shadow: 0 0 3px #000; pointer-events: none; z-index: 2; text-align: right; }
  #ammo b { display: block; font-size: 26px; letter-spacing: 0; line-height: 1.1; } #ammo span { font-size: 13px; letter-spacing: 0; opacity: .75; }
  #ammo.low b { color: #ff7a5a; } #ammo.reloading b { color: #ffd28a; font-size: 18px; letter-spacing: 2px; }
  #mission { position: fixed; left: 184px; top: 40px; color: #fff; text-shadow: 0 0 3px #000; font-size: 13px; line-height: 1.45; pointer-events: none; z-index: 2; background: rgba(0,0,0,.28); padding: 6px 10px; border-left: 3px solid #e0a030; }
  #mission b { color: #ffd98a; letter-spacing: .06em; }
  #banner { position: fixed; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; z-index: 4; opacity: 0; transition: opacity .6s; color: #fff; text-shadow: 0 2px 8px #000; }
  #banner.on { opacity: 1; }
  #banner h1 { margin: 0; font-size: clamp(28px, 6vw, 64px); letter-spacing: .18em; color: #ffd98a; }
  #banner p { margin: 10px 0 0; font-size: clamp(14px, 2.2vw, 22px); }
  #kills { position: fixed; left: 12px; top: 12px; color: #fff; text-shadow: 0 0 3px #000; font-size: 14px; pointer-events: none; z-index: 2; }
  #toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); padding: 10px 18px; border-radius: 10px; background: rgba(0,0,0,.6); color: #fff;
           font-size: 18px; pointer-events: none; opacity: 0; transition: opacity .4s; z-index: 4; }
  #toast.on { opacity: 1; transition: none; }
  #dirs { position: fixed; left: 50%; top: 57%; width: 0; height: 0; pointer-events: none; z-index: 3; }
  .dir { position: absolute; left: -100px; top: -100px; width: 200px; height: 200px; opacity: 0; transform-origin: 100px 100px;
         filter: drop-shadow(0 0 4px rgba(255,196,0,.95)) drop-shadow(0 0 10px rgba(255,140,0,.55)); }
  .dir svg { display: block; animation: dirpop .28s ease-out; transform-origin: 100px 100px; }
  @keyframes dirpop { from { transform: scale(1.35); } to { transform: scale(1); } }
  .tag { position: fixed; transform: translate(-50%, -100%); display: none; flex-direction: column; align-items: center; gap: 1px; pointer-events: none; z-index: 2;
         --c: #6fe35f; color: #b9ffb0; text-shadow: 0 0 3px #000, 0 0 6px #000; font-size: 11px; font-weight: 700; }
  #convoy { display: none !important; position: fixed; left: 184px; top: 116px; z-index: 2; pointer-events: none; color: #fff; text-shadow: 0 0 3px #000; font-size: 13px; background: rgba(0,0,0,.28); padding: 6px 10px; border-left: 3px solid #ffd23a; min-width: 210px; }
  #convoy b { color: #ffe08a; letter-spacing: .06em; }
  #convoy .ok { color: #8ee67a; } #convoy .bad { color: #ff8a7a; }
  #convoy .route { position: relative; height: 6px; margin-top: 7px; border-radius: 3px; background: rgba(255,255,255,.22); }
  #convoy .route u { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: rgba(255,210,58,.55); }
  #convoy .route i { position: absolute; top: -4px; width: 9px; height: 14px; margin-left: -4px; border: 1px solid #000; border-radius: 2px; }
  #convoy .route i.a { background: #ffd23a; } #convoy .route i.d { background: #6c6c6c; }
  #prompt { display: none; position: fixed; left: 50%; bottom: 22%; transform: translateX(-50%); z-index: 3; padding: 9px 18px; border-radius: 10px; font-size: 16px; font-weight: 700;
            color: #fff; background: rgba(30,26,20,.82); border: 2px solid #d8a23a; cursor: pointer; text-shadow: 0 1px 2px #000; }
  .tag.enemy { --c: #ff5a4a; color: #ffc4bd; }
  /* bulle de pensée : panneau sombre et sobre, liseré doré en haut (style « fiche » des jeux de rôle), discret pour ne pas gêner le combat */
  .tag .th { display: none; max-width: 210px; margin-bottom: 4px; padding: 5px 10px 6px; background: rgba(12,10,8,.78); border: 1px solid rgba(216,162,58,.55);
             border-top: 2px solid #d8a23a; box-shadow: 0 2px 6px rgba(0,0,0,.45); font-size: 12px; font-weight: 500; line-height: 1.3; text-align: left; white-space: normal; text-shadow: none; color: #f4ead6;
             animation: thFade .25s ease-out; }
  @keyframes thFade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .tag.self { --c: #4db8ff; color: #c3e8ff; }
  .tag em { font-style: normal; font-size: 14px; line-height: 10px; color: var(--c); }
  .tag i { display: block; width: 42px; height: 4px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.55); border-radius: 3px; overflow: hidden; }
  .tag u { display: block; height: 100%; width: 100%; background: var(--c); text-decoration: none; }
  #wbtn { position: fixed; top: 12px; right: 12px; z-index: 4; font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 10px;
          border: 2px solid #d8a23a; background: rgba(30,26,20,.85); color: #fff; cursor: pointer; }
  #wbtn:hover { background: rgba(216,162,58,.35); }
  .w-box { min-width: 320px; max-width: 90vw; padding: 18px 22px; border-radius: 12px; background: rgba(30,26,20,.92); border: 1px solid rgba(255,255,255,.25); }
  .w-box h2 { margin: 0 0 12px; font-size: 18px; letter-spacing: 3px; text-align: center; }
  .w-item { padding: 10px 12px; margin: 6px 0; border-radius: 8px; border: 2px solid transparent; background: rgba(255,255,255,.06); display: flex; flex-direction: column; gap: 2px; }
  .w-item.sel { border-color: #d8a23a; background: rgba(216,162,58,.18); }
  .w-item span { font-size: 12px; opacity: .8; }
  .w-btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .w-btns button { font: inherit; padding: 10px 14px; min-width: 44px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4); background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }
  .w-hint { margin: 10px 0 0; font-size: 11px; opacity: .65; text-align: center; }
  .w-err { color: #ff9a8a; font-size: 12px; }
  /* barre du bas : fiche de combat (armes, munitions, vie, convoi, escouade) */
  #dock { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; align-items: stretch; gap: 8px; height: 74px; padding: 0 12px; box-sizing: border-box;
          background: linear-gradient(180deg, rgba(58,58,62,.82), rgba(14,14,16,.92)); border-top: 2px solid #c9ced6; box-shadow: 0 -2px 10px rgba(0,0,0,.5);
          color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; z-index: 2; white-space: nowrap; font-family: system-ui, sans-serif; }
  .dk-pv { display: flex; flex-direction: column; justify-content: center; min-width: 150px; padding-right: 10px; border-right: 1px solid rgba(255,255,255,.2); }
  .dk-lbl { font-size: 12px; font-style: italic; opacity: .85; }
  .dk-pv b { font-size: 26px; line-height: 1.05; }
  .dk-bar { height: 8px; margin-top: 3px; background: rgba(255,255,255,.18); border-radius: 2px; overflow: hidden; }
  .dk-bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd23a, #fff); transition: width .2s; }
  .dk-weap { display: flex; align-items: center; gap: 6px; }
  .dk-slot { position: relative; width: 92px; height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-sizing: border-box;
             background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); border-radius: 4px; }
  .dk-slot.sel { border: 2px solid #f2c94c; background: rgba(242,201,76,.2); box-shadow: 0 0 8px rgba(242,201,76,.45); }
  .dk-slot svg { width: 44px; height: 22px; fill: #e9e9e9; }
  .dk-slot.sel svg { fill: #fff3c4; }
  .dk-slot em { position: absolute; left: 5px; top: 2px; font-style: normal; font-size: 10px; opacity: .7; }
  .dk-slot span { font-size: 10px; opacity: .85; }
  .dk-ammo { display: flex; align-items: center; min-width: 110px; padding: 0 10px; border-left: 1px solid rgba(255,255,255,.2); font-size: 28px; font-weight: 800; }
  .dk-ammo span { font-size: 14px; font-weight: 600; opacity: .75; margin-left: 4px; }
  .dk-ammo b { font-size: 16px; letter-spacing: .04em; }
  .dk-info { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.2); font-size: 12px; }
  .dk-info b { color: #f2c94c; }
  #knob { position: absolute; left: 45px; top: 45px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.6); }
</style>

<canvas id="c"></canvas>
<div id="cross"></div>
<div id="hud"></div>

<button id="pbtn" title="Pause (Échap)">⏸ Pause</button>
